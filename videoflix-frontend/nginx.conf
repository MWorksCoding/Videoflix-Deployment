# Single entry point for the whole app (published on host port 8000):
#   * Angular SPA                       -> served from /usr/share/nginx/html
#   * Django API / admin / RQ dashboard -> proxied to the "backend" service
#   * Django static + uploaded media    -> served from shared volumes

# Keep the original scheme when a host reverse proxy terminates TLS in front of us
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Resolving "backend" per request (instead of once at
    # startup) keeps working after the backend container is recreated.
    resolver 127.0.0.11 valid=10s;
    set $django http://backend:8000;

    # Video uploads through the Django admin
    client_max_body_size 2G;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- Django ----------
    # /admin/..., /api/..., /django-rq/... plus the exact API endpoints.
    # Trailing slashes matter: "/login/" is the API, "/login" is the Angular route.
    location ~ ^/((admin|api|django-rq)/|(login|logout|videos|register-verified|password-reset-verified)/$) {
        proxy_pass $django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # collectstatic output (admin, DRF, django-rq, ...)
    location ^~ /static/ {
        root /var/www;
        expires 30d;
    }

    # Uploaded videos + thumbnails. The player requests "<file>/" with a
    # trailing slash, so strip it before looking up the file.
    location ^~ /media/ {
        root /var/www;
        rewrite ^(/media/.+)/$ $1 break;
    }

    # ---------- Angular ----------
    # Cache fingerprinted build assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular single-page app: route everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
