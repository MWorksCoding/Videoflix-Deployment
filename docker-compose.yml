name: videoflix

# ---------------------------------------------------------------------------
# Shared environment for the Django backend and the RQ worker.
# Values use ${VAR:-default}, so:
#   * with no .env present -> it runs out-of-the-box with the defaults below
#   * with a .env next to this file (or exported vars) -> your values win
# ---------------------------------------------------------------------------
x-backend-env: &backend-env
  DEBUG: "${DEBUG:-True}"
  SECRET_KEY: "${SECRET_KEY:-django-insecure-local-dev-key-change-me}"
  DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  # --- Database (talks to the "db" service over the compose network) ---
  DATABASE_NAME: "${DATABASE_NAME:-database_videoflix}"
  DATABASE_USER: "${DATABASE_USER:-videoflix_user}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD:-videoflix_password}"
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  # --- Redis (talks to the "redis" service over the compose network) ---
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-foobared}"
  # --- Email ---
  # Default = console backend: verification/reset emails are printed to the
  # backend logs so you can test locally without an SMTP server.
  # Set real SMTP values in your .env for production.
  EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
  AUTHEMAIL_DEFAULT_EMAIL_FROM: "${AUTHEMAIL_DEFAULT_EMAIL_FROM:-no-reply@videoflix.local}"
  AUTHEMAIL_DEFAULT_EMAIL_BCC: "${AUTHEMAIL_DEFAULT_EMAIL_BCC:-}"
  AUTHEMAIL_EMAIL_HOST: "${AUTHEMAIL_EMAIL_HOST:-}"
  AUTHEMAIL_EMAIL_PORT: "${AUTHEMAIL_EMAIL_PORT:-587}"
  AUTHEMAIL_EMAIL_HOST_USER: "${AUTHEMAIL_EMAIL_HOST_USER:-}"
  AUTHEMAIL_EMAIL_HOST_PASSWORD: "${AUTHEMAIL_EMAIL_HOST_PASSWORD:-}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-database_videoflix}"
      POSTGRES_USER: "${DATABASE_USER:-videoflix_user}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-videoflix_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 -> container 5432 (5433 avoids clashing with a local/brew Postgres).
      # Only needed if you want to inspect the DB from the host; remove if not.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-videoflix_user} -d ${DATABASE_NAME:-database_videoflix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: cache + RQ task queue
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-foobared}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-foobared}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Django API (gunicorn). Runs DB migrations on startup, then serves on :8000.
  backend:
    build: ./videoflix-backend
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn videoflix_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]
    environment:
      <<: *backend-env
    volumes:
      - media_data:/usr/src/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # RQ worker: runs the ffmpeg video conversions enqueued by the backend.
  # Same image as the backend, different command. Shares the media volume.
  worker:
    build: ./videoflix-backend
    command: ["python", "manage.py", "rqworker", "default"]
    environment:
      <<: *backend-env
    volumes:
      - media_data:/usr/src/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Angular app built to static files and served by nginx on :80.
  # CONFIGURATION=development -> baseUrl points at http://127.0.0.1:8000 (local).
  # For your server, build with CONFIGURATION=production (see README).
  frontend:
    build:
      context: ./videoflix-frontend
      args:
        CONFIGURATION: development
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
